name: lab-inventory-exact-head
on:
  push:
    branches: [main, 'lab/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  harness:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Scaffold contract — expected GREEN
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_harness*.py' -v
  app:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Real feature contracts — expected RED until feature PR A and B
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_inventory*.py' -v
