name: runner-stage1-pilot
on:
  push:
    branches: ['lab/runner-stage1-*']
    paths:
      - 'scripts/runner_pilot.py'
      - 'tests/test_runner_pilot.py'
      - 'docs/RUNNER_STAGE1_PILOT.md'
      - '.github/workflows/runner-stage1-pilot.yml'
  pull_request:
    paths:
      - 'scripts/runner_pilot.py'
      - 'tests/test_runner_pilot.py'
      - 'docs/RUNNER_STAGE1_PILOT.md'
      - '.github/workflows/runner-stage1-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-runner-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile pinned Stage 1 pilot
        run: python -m py_compile scripts/runner_pilot.py tests/test_runner_pilot.py
      - name: Runner RNR-01–03 native positive and adversarial tests
        run: python -m unittest discover -s tests -p 'test_runner_pilot.py' -v
